function modalMovimientoCliente(cliente, tipoFijo, ctx){
  cliente = cliente || null;
  ctx = ctx || {};
  // Si viene de un ticket con saldo pendiente, lo normal es que sea un abono
  const tipoInicial = tipoFijo || (ctx.referencia_lavado_id ? 'debito' : 'credito');
  abrirModal(tipoFijo==='credito'?'Registrar crédito':(tipoFijo==='debito'?'Registrar abono':'Registrar movimiento'), `
    ${cliente?`<div class="chip" style="margin-bottom:10px;">${esc(cliente.nombre||cliente.telefono)}</div>`:`
    ${campoBuscarClienteHTML('mcBuscar')}
    <label class="field-label">Teléfono del cliente</label><input type="tel" id="mcTelefono">
    <label class="field-label">Nombre del cliente</label><input type="text" id="mcNombre" data-cap="nombre">`}
    ${ctx.saldoPendiente!==undefined?`<div class="help-text" style="margin-bottom:6px;">Saldo pendiente de esta factura: <b style="color:var(--ink);">${fmtUsd(ctx.saldoPendiente)}</b></div>`:''}
    ${!tipoFijo?`<label class="field-label">Tipo de movimiento</label>
    <div class="seg-mini">
      <button type="button" class="${tipoInicial==='credito'?'active':''}" data-tipo="credito">Crédito (debe)</button>
      <button type="button" class="${tipoInicial==='debito'?'active':''}" data-tipo="debito">Abono (paga)</button>
    </div>`:''}
    <label class="field-label">Monto (USD)</label><input type="number" step="0.01" id="mcMonto"${ctx.saldoPendiente!==undefined?` value="${Number(ctx.saldoPendiente).toFixed(2)}"`:''}>
    <label class="field-label">Concepto</label><input type="text" id="mcConcepto" placeholder="Ej: fiado del lavado, abono en efectivo…">
    <button class="btn btn-primary btn-block" id="btnGuardarMovCliente" style="margin-top:18px;">Guardar</button>
  `);
  let tipo = tipoInicial;
  let clienteElegido = cliente;
  if(!cliente){
    initBuscarCliente('mcBuscar', function(cl){
      clienteElegido = cl;
      document.getElementById('mcTelefono').value = cl.telefono || '';
      document.getElementById('mcNombre').value = cl.nombre || '';
    });
  }
  document.querySelectorAll('.seg-mini [data-tipo]').forEach(b=> b.addEventListener('click', function(){
    document.querySelectorAll('.seg-mini [data-tipo]').forEach(x=>x.classList.remove('active'));
    this.classList.add('active'); tipo = this.dataset.tipo;
  }));
  document.getElementById('btnGuardarMovCliente').addEventListener('click', async function(){
    const btn=this; const monto = Number(document.getElementById('mcMonto').value);
    if(!monto || monto<=0){ toast('Escribe un monto válido', true); return; }
    btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Guardando…';
    let cl = clienteElegido;
    if(!cl || !cl.id){
      const telefono = document.getElementById('mcTelefono').value.trim();
      const nombre = document.getElementById('mcNombre').value.trim();
      if(!telefono){ toast('Escribe el teléfono del cliente', true); btn.disabled=false; btn.innerHTML='Guardar'; return; }
      const {data, error} = await buscarOCrearCliente(telefono, nombre);
      if(error){ toast('No se pudo registrar el cliente: '+mensajeError(error), true); btn.disabled=false; btn.innerHTML='Guardar'; return; }
      cl = data;
    }
    // Si es un abono contra un lavado que todavía no tiene su deuda base
    // registrada, se registra primero (así queda "debiendo el resto" y no
    // "a favor" al insertar solo el abono).
    if(tipo==='debito' && ctx.referencia_lavado_id && ctx.total){
      await asegurarObligacionLavado(ctx.referencia_lavado_id, cl.id, ctx.total);
    }
    const refs = ctx.referencia_lavado_id ? {referencia_lavado_id: ctx.referencia_lavado_id} : null;
    await registrarMovimientoCuenta(cl.id, tipo, monto, document.getElementById('mcConcepto').value.trim()||null, refs);
    toast('Movimiento registrado');
    if(ctx.volverAlTicket){ refrescarListadoDeFondo(); abrirTicketLavado(ctx.volverAlTicket); return; }
    cerrarModal();
    if(VISTA_ACTUAL==='cuentas_clientes') buscarCuentasClientes();
  });
}

async function ajustarFidelidad(id, campo, delta){
  const {data} = await sb.from('tarjetas_fidelidad').select('*').eq('id', id).single();
  if(!data){ toast('No se pudo leer la tarjeta', true); return; }
  const umbral = CONFIG_GENERAL.umbral_fidelidad_sellos || 6;
  let patch;
  if(campo==='sello'){
    let sellos = Math.max(0, data.sellos+delta); let gratis = data.lavados_gratis_disponibles;
    if(delta>0 && sellos>=umbral){ sellos=0; gratis+=1; toast('¡Sello completado! Lavado gratis otorgado'); }
    patch = {sellos, lavados_gratis_disponibles:gratis};
  } else {
    patch = {lavados_gratis_disponibles: Math.max(0, data.lavados_gratis_disponibles+delta)};
  }
  const {error} = await sb.from('tarjetas_fidelidad').update(patch).eq('id', id);
  if(error){ toast('No se pudo actualizar: '+mensajeError(error), true); return; }
  cargarFidelidad();
}

  document.getElementById('btnGuardarTarjeta').addEventListener('click', async function(){
    const btn=this; const telefono = document.getElementById('tfTelefono').value.trim();
    const nombre = document.getElementById('tfNombre').value.trim();

    if(errCliente){ toast('No se pudo registrar el cliente: '+mensajeError(errCliente), true); btn.disabled=false; btn.innerHTML='Crear tarjeta'; return; }

  const {data, error} = await sb.from('seguros_lluvia').select('*, clientes(nombre, telefono)').order('fecha_lavado',{ascending:false}).limit(150);
  if(error){ cont.innerHTML = `<div class="error-state">No se pudo cargar: ${esc(mensajeError(error))}</div>`; return; }
  const ahora = new Date();
  const filtro = document.getElementById('fLluviaEstado').value;
  let lista = (data||[]).map(s=>{
    const estado = s.usado ? 'usado' : (new Date(s.vence_at) < ahora ? 'vencido' : 'activo');
    return Object.assign({}, s, {estadoCalc: estado});
  });
  if(filtro) lista = lista.filter(s=> s.estadoCalc===filtro);
  if(lista.length===0){ cont.innerHTML = emptyState('cloud-rain','No hay registros de seguro de lluvia'); return; }
  const map = {activo:'confirmada', usado:'completada', vencido:'vencida'};
  cont.innerHTML = lista.map(s=>`
    <div class="item-row glass st-${map[s.estadoCalc]}">
      <span class="info"><span class="t1">${esc(s.clientes?.nombre||s.clientes?.telefono||'Cliente')} ${badge(map[s.estadoCalc], {confirmada:'Activo',completada:'Usado',vencida:'Vencido'})}</span>
      <span class="t2">Lavado: ${fmtFechaHora(s.fecha_lavado)} · Vence: ${fmtFechaHora(s.vence_at)}</span></span>
      <span class="amt mono">${fmtUsd(s.precio_usd)}</span>
      <span class="acts">${s.estadoCalc==='activo'?`<button class="btn btn-primary btn-sm" onclick="marcarLluviaUsada('${s.id}')">Marcar usado</button>`:''}</span>
    </div>`).join('');
}
async function marcarLluviaUsada(id){

  abrirModal('Nuevo usuario', `
    <label class="field-label">Nombre completo</label><input type="text" id="usNombre" data-cap="nombre">
    <label class="field-label">Correo</label><input type="email" id="usEmail">
    <label class="field-label">Contraseña temporal</label><input type="text" id="usPass" placeholder="Mínimo 6 caracteres">
    <label class="field-label">Rol</label>
    <select id="usRol"><option value="vendedor">Vendedor</option><option value="jefe">Jefe</option><option value="admin">Admin</option></select>
    <div class="help-text">El usuario podrá iniciar sesión de inmediato con este correo y contraseña. Pídele que la cambie luego desde su cuenta.</div>
    <button class="btn btn-primary btn-block" id="btnGuardarUsuario" style="margin-top:18px;">Crear usuario</button>
  `);
  document.getElementById('btnGuardarUsuario').addEventListener('click', async function(){
    const btn=this;
    const nombre = document.getElementById('usNombre').value.trim();
    const email = document.getElementById('usEmail').value.trim();
    const pass = document.getElementById('usPass').value;
    const rol = document.getElementById('usRol').value;
    if(!nombre || !email || !pass){ toast('Completa todos los campos', true); return; }
    if(pass.length < 6){ toast('La contraseña debe tener al menos 6 caracteres', true); return; }
    btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Creando…';
    // Se usa un cliente temporal, sin persistir sesión, para no reemplazar
    // la sesión activa del administrador que está creando el usuario.
    const tempClient = crearClienteSeguro({auth:{persistSession:false, autoRefreshToken:false}});
    const {data, error} = await tempClient.auth.signUp({email, password:pass, options:{data:{nombre_completo: capitalizar(nombre), rol}}});
    if(error){ toast('No se pudo crear el usuario: '+mensajeError(error), true); btn.disabled=false; btn.innerHTML='Crear usuario'; return; }
    toast('Usuario creado'); cerrarModal(); cargarUsuarios();
  });
}

/* =====================================================================
   CONFIGURACIÓN (solo admin)
===================================================================== */
async function cargarConfigTab(){
  const {data: cfg} = await sb.from('config_general').select('*').eq('id',1).single();
  CONFIG_GENERAL = cfg || CONFIG_GENERAL;
  var c = document.getElementById('content');
  c.innerHTML = `
    <div class="section-head"><h2>Configuración general</h2></div>
    <div class="stat-card glass" style="max-width:520px; padding:20px; ${esAdmin()?'':'display:none;'}">
      <label class="field-label" style="margin-top:0;">Precio del seguro de lluvia (USD)</label>
      <input type="number" step="0.01" id="cfgSeguro" value="${CONFIG_GENERAL.precio_seguro_lluvia_usd ?? 1.5}">
      <label class="field-label">Horas de validez del seguro de lluvia</label>
      <input type="number" id="cfgHoras" value="${CONFIG_GENERAL.horas_seguro_lluvia ?? 48}">
      <label class="field-label">Sellos necesarios para un lavado gratis</label>
      <input type="number" id="cfgUmbral" value="${CONFIG_GENERAL.umbral_fidelidad_sellos ?? 6}">
      <label class="field-label">WhatsApp del negocio</label>
      <input type="text" id="cfgWhatsapp" value="${esc(CONFIG_GENERAL.whatsapp_negocio ?? '')}">
      <label class="field-label">Instagram (usuario o enlace)</label>
      <input type="text" id="cfgInstagram" value="${esc(CONFIG_GENERAL.instagram_negocio ?? '')}">
      <label class="field-label">Facebook (usuario o enlace)</label>
      <input type="text" id="cfgFacebook" value="${esc(CONFIG_GENERAL.facebook_negocio ?? '')}">
      <label class="field-label">TikTok (usuario o enlace)</label>
      <input type="text" id="cfgTiktok" value="${esc(CONFIG_GENERAL.tiktok_negocio ?? '')}">
      <button class="btn btn-primary" style="margin-top:18px;" id="btnGuardarConfig">Guardar cambios</button>
    </div>
    <div class="stat-card glass" style="max-width:520px; padding:20px; margin-top:16px;">
      <h3 style="font-size:14px;margin:0 0 4px;">Código de autorización</h3>
      <div class="help-text" style="margin-top:0;">El vendedor necesita este código para anular una factura o quitar un producto ya facturado. El jefe y el administrador no lo necesitan. <span id="cfgCodigoEstado"></span></div>
      <label class="field-label">Nuevo código (mínimo 4 caracteres)</label>
      <input type="password" id="cfgCodigo" placeholder="••••••" autocomplete="new-password">
      <button class="btn btn-primary" style="margin-top:14px;" id="btnGuardarCodigo">Guardar código</button>
    </div>`;
  drawIcons(c);
  sb.rpc('hay_codigo_autorizacion').then(({data})=>{
    const el = document.getElementById('cfgCodigoEstado');
    if(el) el.innerHTML = data ? '<b style="color:var(--g1);">Ya hay un código configurado.</b>' : '<b style="color:var(--amber);">Todavía no has configurado un código.</b>';
  });
  document.getElementById('btnGuardarCodigo').addEventListener('click', async function(){
    const btn=this; const codigo = document.getElementById('cfgCodigo').value.trim();
    if(codigo.length < 4){ toast('El código debe tener al menos 4 caracteres', true); return; }
    btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Guardando…';
    const {error} = await sb.rpc('definir_codigo_autorizacion', {p_codigo: codigo});
    btn.disabled=false; btn.innerHTML='Guardar código';
    if(error){ toast('No se pudo guardar: '+mensajeError(error), true); return; }
    document.getElementById('cfgCodigo').value = '';
    document.getElementById('cfgCodigoEstado').innerHTML = '<b style="color:var(--g1);">Ya hay un código configurado.</b>';
    toast('Código de autorización actualizado');
  });
  document.getElementById('btnGuardarConfig').addEventListener('click', async function(){
    const btn=this; btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Guardando…';
    const payload = {
      precio_seguro_lluvia_usd: Number(document.getElementById('cfgSeguro').value)||0,
      horas_seguro_lluvia: Number(document.getElementById('cfgHoras').value)||48,
      umbral_fidelidad_sellos: Number(document.getElementById('cfgUmbral').value)||6,
      whatsapp_negocio: document.getElementById('cfgWhatsapp').value.trim()||null,
      instagram_negocio: document.getElementById('cfgInstagram').value.trim()||null,
      facebook_negocio: document.getElementById('cfgFacebook').value.trim()||null,
      tiktok_negocio: document.getElementById('cfgTiktok').value.trim()||null,
      updated_at: ahoraISO()
    };
    const {error} = await sb.from('config_general').update(payload).eq('id',1);
    btn.disabled=false; btn.innerHTML='Guardar cambios';
    if(error){ toast('No se pudo guardar: '+mensajeError(error), true); return; }
    CONFIG_GENERAL = Object.assign(CONFIG_GENERAL, payload);
    toast('Configuración guardada');
  });
}
</script>
</body>
