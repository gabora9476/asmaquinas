<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Panel · Máquinas Autoservicios</title>
<meta name="theme-color" content="#090C0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="https://i.ibb.co/7dZ9Yw7f/Maquinas-G.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/7dZ9Yw7f/Maquinas-G.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#090C0A; --bg-2:#0D110E; --bg-glow:#0F1C14;
  --ink:#EFF6F1; --ink-soft:#9FB3A6; --ink-faint:#5C6E62;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.075); --glass-strong:rgba(20,26,22,.82);
  --g1:#22D46B; --g2:#0E9C50; --g-soft:rgba(34,212,107,.16); --g-line:rgba(34,212,107,.35);
  --amber:#E8B04B; --red:#F2685C; --blue:#4FA0E8;
  --shadow-glass:inset 0 1px 0 rgba(255,255,255,.10), 0 10px 26px rgba(0,0,0,.45);
  --shadow-pop:0 18px 44px rgba(0,0,0,.55);
  --ease:cubic-bezier(.32,.72,0,1);
  --sidebar-w:242px; --radius:18px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif; color:var(--ink); min-height:100vh;
  background:
    radial-gradient(900px 480px at 15% -8%, rgba(34,212,107,.14), transparent 60%),
    radial-gradient(700px 420px at 100% 0%, rgba(34,212,107,.07), transparent 55%),
    var(--bg);
  -webkit-font-smoothing:antialiased; font-size:13px;
}
h1,h2,h3,.display{font-family:'Manrope',system-ui,sans-serif; letter-spacing:-.01em; color:var(--ink);}
.mono{font-family:'JetBrains Mono',monospace;}
.hidden{display:none !important;}
input,select,textarea,button{font-family:inherit;}
::selection{background:var(--g-soft); color:var(--ink);}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14); border-radius:99px;}
:focus-visible{outline:2px solid var(--g1); outline-offset:2px; border-radius:6px;}

/* ---------- vidrio líquido ---------- */
.glass{
  background:linear-gradient(160deg, var(--glass-2), var(--glass));
  backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid var(--line); box-shadow:var(--shadow-glass);
}
.glass-solid{background:var(--glass-strong); backdrop-filter:blur(28px) saturate(170%); -webkit-backdrop-filter:blur(28px) saturate(170%); border:1px solid var(--line-2);}

/* ---------- login ---------- */
#viewLogin{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:26px; position:relative; overflow:hidden;}
.blob{position:absolute; border-radius:50%; filter:blur(70px); pointer-events:none; opacity:.55;}
.blob-a{width:420px; height:420px; background:radial-gradient(circle, rgba(34,212,107,.5), transparent 70%); top:-160px; left:-140px; animation:float1 11s ease-in-out infinite;}
.blob-b{width:360px; height:360px; background:radial-gradient(circle, rgba(79,160,232,.28), transparent 70%); bottom:-160px; right:-120px; animation:float2 13s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0);} 50%{transform:translate(24px,26px);}}
@keyframes float2{0%,100%{transform:translate(0,0);} 50%{transform:translate(-20px,-24px);}}
.login-card{position:relative; z-index:1; width:100%; max-width:378px; border-radius:28px; padding:36px 26px; text-align:center;}
.login-card img{width:120px; margin:0 auto 16px; display:block; filter:drop-shadow(0 8px 20px rgba(34,212,107,.25));}
.login-card h1{font-size:19px; margin:0 0 4px; font-weight:800;}
.login-card p{color:var(--ink-soft); font-size:12.5px; margin:0 0 22px;}
.field-label{display:block; font-size:11.5px; font-weight:700; color:var(--ink-soft); margin:14px 0 7px; text-align:left; text-transform:uppercase; letter-spacing:.4px;}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=email],input[type=password],select,textarea{
  width:100%; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,.04);
  font-size:13.5px; color:var(--ink); outline:none; transition:border .15s, box-shadow .15s; appearance:none;
}
select{background-image:none;}
textarea{resize:vertical; min-height:64px;}
input::placeholder,textarea::placeholder{color:var(--ink-faint);}
input:focus,select:focus,textarea:focus{border-color:var(--g1); box-shadow:0 0 0 3px var(--g-soft);}
#loginError{color:var(--red); font-size:12px; font-weight:600; margin-top:10px; min-height:16px;}
.pw-wrap{position:relative;}
.pw-wrap button{position:absolute; right:6px; top:6px; bottom:6px; background:none; border:none; color:var(--ink-faint); cursor:pointer; padding:0 8px;}
.pw-wrap button svg{width:16px;height:16px;}

/* ---------- botones estilo iOS / vidrio líquido ---------- */
.btn{position:relative; overflow:hidden; display:inline-flex; align-items:center; justify-content:center; gap:7px; border:none; cursor:pointer; font-weight:700; font-size:13px; padding:11px 18px; border-radius:999px; transition:transform .15s var(--ease), opacity .15s; -webkit-user-select:none; user-select:none;}
.btn:active{transform:scale(.965);}
.btn:disabled{opacity:.55; cursor:default;}
.btn svg{width:15px;height:15px;flex-shrink:0;}
.btn-primary{color:#04150B; background:linear-gradient(180deg, var(--g1), var(--g2)); box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 8px 20px rgba(14,156,80,.32);}
.btn-block{width:100%;}
.btn-glass{background:linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.03)); backdrop-filter:blur(16px); color:var(--ink); border:1px solid var(--line-2); box-shadow:inset 0 1px 0 rgba(255,255,255,.14);}
.btn-ghost{background:transparent; color:var(--ink-soft); box-shadow:none; padding:9px 11px;}
.btn-danger{background:rgba(242,104,92,.14); color:#FF9C8F; border:1px solid rgba(242,104,92,.28);}
.btn-sm{padding:8px 13px; font-size:12px; border-radius:12px;}
.btn-icon{width:36px;height:36px;padding:0;border-radius:50%;}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- shell de la app ---------- */
#viewApp{display:none; min-height:100vh;}
#viewApp.show{display:block;}
.app-frame{display:flex; min-height:100vh;}

.sidebar{width:var(--sidebar-w); flex-shrink:0; display:none; flex-direction:column; padding:20px 13px; position:sticky; top:0; height:100vh; border-right:1px solid var(--line);}
.sidebar-logo{display:flex; align-items:center; gap:10px; padding:6px 8px 20px;}
.sidebar-logo img{width:32px; height:32px; object-fit:contain;}
.sidebar-logo span{font-family:'Manrope'; font-weight:800; font-size:13.5px; line-height:1.2;}
.nav-group-label{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--ink-faint); padding:14px 12px 6px;}
.nav-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:13px; color:var(--ink-soft); text-decoration:none; font-size:13px; font-weight:600; cursor:pointer; margin-bottom:2px; border:none; background:none; width:100%; text-align:left; position:relative;}
.nav-item svg{width:17px;height:17px; flex-shrink:0;}
.nav-item.active{background:var(--g-soft); color:var(--g1);}
.nav-item:hover:not(.active){background:rgba(255,255,255,.045); color:var(--ink);}
.sidebar-foot{margin-top:auto; padding:12px 4px 0; border-top:1px solid var(--line);}
.sidebar-user{display:flex; align-items:center; gap:9px; padding:10px 6px;}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(160deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#04150B;flex-shrink:0;}
.sidebar-user .u1{font-size:12px; font-weight:700; line-height:1.3;}
.sidebar-user .u2{font-size:10.5px; color:var(--ink-faint); text-transform:capitalize;}

.main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line); background:rgba(9,12,10,.72); backdrop-filter:blur(20px);}
.topbar h1{font-size:16.5px; margin:0; font-weight:800;}
.topbar-right{display:flex; align-items:center; gap:8px;}

.content{padding:16px 16px calc(104px + env(safe-area-inset-bottom,0px));}
@media(min-width:900px){ .sidebar{display:flex;} .content{padding:26px 32px 44px;} }

/* ---------- dock inferior móvil ---------- */
.dock-wrap{position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; padding:0 14px calc(env(safe-area-inset-bottom,0px) + 14px); pointer-events:none;}
@media(min-width:900px){ .dock-wrap{display:none;} }
.dock{pointer-events:auto; display:flex; gap:2px; padding:7px; border-radius:26px; background:linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03)); backdrop-filter:blur(26px) saturate(180%); -webkit-backdrop-filter:blur(26px) saturate(180%); border:1px solid var(--line-2); box-shadow:0 16px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.14); max-width:420px; width:100%;}
.dock-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 2px 8px; background:none; border:none; color:var(--ink-faint); cursor:pointer; border-radius:19px; position:relative;}
.dock-item svg{width:20px;height:20px;}
.dock-item span{font-size:9.5px; font-weight:700;}
.dock-item.active{color:var(--g1); background:var(--g-soft);}

/* ---------- sheet inferior (Más / detalle) ---------- */
.sheet-overlay{position:fixed; inset:0; background:rgba(4,10,7,.55); backdrop-filter:blur(4px); z-index:60; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s var(--ease);}
.sheet-overlay.show{opacity:1; pointer-events:auto;}
@media(min-width:640px){ .sheet-overlay{align-items:center;} }
.sheet-box{width:100%; max-width:440px; max-height:86vh; overflow-y:auto; border-radius:26px 26px 0 0; padding:18px 20px calc(env(safe-area-inset-bottom,0px) + 20px); transform:translateY(100%); transition:transform .38s var(--ease);}
@media(min-width:640px){ .sheet-box{border-radius:24px; transform:translateY(24px) scale(.97); opacity:0;} }
.sheet-overlay.show .sheet-box{transform:translateY(0) scale(1); opacity:1;}
.sheet-grab{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.18); margin:0 auto 14px;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.sheet-head h3{font-size:15.5px; margin:0; font-weight:800;}
.modal-close{width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);}
.modal-close svg{width:14px;height:14px;}
.sheet-nav-item{display:flex; align-items:center; gap:12px; padding:12px 8px; border-radius:14px; color:var(--ink); background:none; border:none; width:100%; text-align:left; font-size:13.5px; font-weight:600; cursor:pointer;}
.sheet-nav-item svg{width:19px;height:19px; color:var(--g1);}
.sheet-nav-item:active{background:rgba(255,255,255,.05);}

/* ---------- stat cards ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:20px;}
@media(min-width:640px){ .stat-grid{grid-template-columns:repeat(4,1fr);} }
.stat-card{border-radius:20px; padding:15px;}
.stat-card .ic{width:30px;height:30px;border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--g-soft); color:var(--g1); margin-bottom:9px;}
.stat-card .ic svg{width:15px;height:15px;}
.stat-card .val{font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:700;}
.stat-card .lbl{font-size:10.5px; color:var(--ink-soft); font-weight:600; margin-top:2px;}

/* ---------- listas / secciones ---------- */
.section-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:13px;}
.section-head h2{font-size:15.5px; margin:0; font-weight:800;}
.tabs-row{display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px;}
.tab-btn{flex-shrink:0; padding:8px 15px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--ink-soft); font-weight:700; font-size:12px; cursor:pointer;}
.tab-btn.active{border-color:var(--g-line); background:var(--g-soft); color:var(--g1);}
.filters-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.filters-row select, .filters-row input{width:auto; min-width:128px; padding:9px 12px; font-size:12px; border-radius:12px;}

.card-list{display:flex; flex-direction:column; gap:9px;}
.item-row{border-radius:17px; padding:13px 15px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; border-left:3px solid var(--ink-faint);}
.item-row.st-pendiente,.item-row.st-vencida{border-left-color:var(--amber);}
.item-row.st-confirmada,.item-row.st-en_proceso,.item-row.st-parcial{border-left-color:var(--blue);}
.item-row.st-completada,.item-row.st-completado,.item-row.st-pagada,.item-row.st-pagado{border-left-color:var(--g1);}
.item-row.st-cancelada,.item-row.st-anulado,.item-row.st-anulada{border-left-color:var(--red); opacity:.72;}
.item-row .info{flex:1; min-width:160px;}
.item-row .info .t1{font-weight:700; font-size:13px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.item-row .info .t2{font-size:11px; color:var(--ink-soft); margin-top:3px; line-height:1.5;}
.item-row .amt{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13.5px; white-space:nowrap;}
.item-row .acts{display:flex; gap:6px; flex-wrap:wrap;}

/* ---------- ajustes para móvil: filas y botones legibles ---------- */
@media(max-width:640px){
  .item-row{padding:12px 13px; gap:9px;}
  .item-row .info{min-width:100%;}
  .item-row .amt{font-size:15px;}
  .item-row .acts{width:100%; gap:7px;}
  /* Los botones de acción reparten el ancho para no quedar apretados */
  .item-row .acts .btn{flex:1 1 auto; min-width:0; min-height:38px; padding:9px 10px; justify-content:center;}
  .item-row .acts .btn-icon{flex:0 0 38px; width:38px; height:38px; padding:0;}
  .item-row .acts select{flex:1 1 auto; min-height:38px;}
  .section-head h2{font-size:14.5px;}
  .filters-row select, .filters-row input{flex:1 1 44%; min-width:0;}
  .modal-box, .sheet-box{max-height:90vh;}
  .form-row3{grid-template-columns:1fr 1fr;}
  .btn{min-height:40px;}
  .tab-btn{min-height:36px;}
}
/* Evita el zoom automático de iOS al enfocar un campo */
@media(max-width:820px){
  input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=email],input[type=password],select,textarea{font-size:16px;}
}
.item-row.clickable{cursor:pointer;}
.item-row.clickable:hover{border-color:var(--line-2);}

.empty-state{text-align:center; padding:44px 16px; color:var(--ink-faint); font-size:12.5px;}
.empty-state svg{width:32px;height:32px;margin-bottom:10px; opacity:.6;}
.error-state{text-align:center; padding:28px 16px; color:#FF9C8F; font-size:12px; background:rgba(242,104,92,.08); border-radius:16px; border:1px solid rgba(242,104,92,.2);}

.badge{display:inline-block; padding:3px 9px; border-radius:99px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.3px;}
.b-pendiente,.b-vencida{background:rgba(232,176,75,.16); color:var(--amber);}
.b-confirmada,.b-en_proceso,.b-parcial{background:rgba(79,160,232,.16); color:var(--blue);}
.b-completada,.b-completado,.b-pagada,.b-pagado{background:var(--g-soft); color:var(--g1);}
.b-cancelada,.b-anulado,.b-anulada{background:rgba(242,104,92,.14); color:#FF9C8F;}
.b-rol-admin{background:rgba(232,176,75,.16); color:var(--amber);}
.b-rol-jefe{background:rgba(79,160,232,.16); color:var(--blue);}
.b-rol-vendedor{background:var(--g-soft); color:var(--g1);}

.switch{position:relative; width:40px; height:23px; flex-shrink:0; display:inline-block;}
.switch input{opacity:0;width:0;height:0;}
.switch .track{position:absolute; inset:0; background:rgba(255,255,255,.14); border-radius:99px; transition:.25s; cursor:pointer;}
.switch .track::before{content:'';position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s var(--ease); box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked + .track{background:var(--g1);}
.switch input:checked + .track::before{transform:translateX(17px);}

/* ---------- modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(4,10,7,.55); backdrop-filter:blur(4px); z-index:60; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s var(--ease);}
.modal-overlay.show{opacity:1; pointer-events:auto;}
@media(min-width:640px){ .modal-overlay{align-items:center;} }
.modal-box{width:100%; max-width:460px; max-height:88vh; overflow-y:auto; border-radius:26px 26px 0 0; padding:20px 22px calc(env(safe-area-inset-bottom,0px) + 22px); transform:translateY(100%); transition:transform .38s var(--ease);}
@media(min-width:640px){ .modal-box{border-radius:24px; transform:translateY(24px) scale(.97); opacity:0;} }
.modal-overlay.show .modal-box{transform:translateY(0) scale(1); opacity:1;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.modal-head h3{font-size:15.5px; margin:0; font-weight:800;}
.modal-actions{display:flex; gap:10px; margin-top:18px;}
.form-row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.form-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}

.toast{position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); left:50%; transform:translateX(-50%) translateY(-140%); z-index:90; background:#161B18; color:#fff; padding:12px 18px; border-radius:14px; font-size:12.5px; font-weight:600; box-shadow:0 12px 32px rgba(0,0,0,.4); display:flex; align-items:center; gap:8px; transition:transform .35s var(--ease); max-width:88vw; border:1px solid var(--line-2);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast svg{width:15px;height:15px;flex-shrink:0; color:var(--g1);}
.toast.err svg{color:var(--red);}
.toast.err{border-color:rgba(242,104,92,.3);}

.seg-mini{display:flex; gap:6px;}
.seg-mini button{flex:1; padding:9px 6px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.03); font-weight:700; font-size:12px; color:var(--ink-soft); cursor:pointer;}
.seg-mini button.active{border-color:var(--g-line); background:var(--g-soft); color:var(--g1);}

.help-text{font-size:11px; color:var(--ink-faint); margin-top:5px; line-height:1.55;}
/* Autocompletado de clientes registrados */
.ac-wrap{position:relative;}
.ac-list{position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:70; max-height:186px; overflow-y:auto; border-radius:14px; background:var(--glass-strong); backdrop-filter:blur(26px) saturate(170%); -webkit-backdrop-filter:blur(26px) saturate(170%); border:1px solid var(--line-2); box-shadow:var(--shadow-pop); display:none;}
.ac-list.show{display:block;}
.ac-item{padding:10px 13px; cursor:pointer; border-bottom:1px solid var(--line);}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover,.ac-item.sel{background:var(--g-soft);}
.ac-item .a1{font-size:12.5px; font-weight:700;}
.ac-item .a2{font-size:11px; color:var(--ink-soft); margin-top:2px;}
.ac-empty{padding:11px 13px; font-size:11.5px; color:var(--ink-faint);}
.divider{height:1px; background:var(--line); margin:16px 0;}
.chip{display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:99px; background:rgba(255,255,255,.05); border:1px solid var(--line); font-size:11px; font-weight:600; color:var(--ink-soft);}
.cart-line{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
.cart-line:last-child{border-bottom:none;}
.cart-line .cl-name{flex:1; font-size:12.5px; font-weight:600;}
.cart-line .cl-qty{width:64px;}
.cart-line .cl-amt{font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:700; width:64px; text-align:right;}
.qty-stepper{display:flex; align-items:center; gap:6px;}

    if(el.className) svg.setAttribute('class', el.className);
    el.replaceWith(svg);

function mostrarAvisoConexion(){
  if(document.getElementById('avisoConexion')) return;
  var b = document.createElement('div');
  b.id = 'avisoConexion';
  b.textContent = 'No se pudo conectar con el servidor. Revisa tu conexión a internet o desactiva bloqueadores de anuncios y recarga la página.';

function crearClienteSeguro(opts){
  try{
    if(!window.supabase || typeof window.supabase.createClient !== 'function') throw new Error('La librería de Supabase no cargó');
    return window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, opts||{});
  }catch(e){
    console.error('No se pudo inicializar Supabase:', e);
    mostrarAvisoConexion();
    var respuestaError = { data:null, error:{ message:'Sin conexión con el servidor' } };
    function cadenaSegura(){
      return new Proxy(function(){}, { get:function(t,p){
        if(p==='then') return function(resolve){ resolve(respuestaError); };
        if(p==='catch') return function(){ return Promise.resolve(respuestaError); };
        return cadenaSegura();
      }, apply:function(){ return cadenaSegura(); } });
    }
    return new Proxy({}, { get:function(t,p){
      if(p==='auth') return { getSession:async()=>respuestaError, signInWithPassword:async()=>respuestaError, signOut:async()=>respuestaError, signUp:async()=>respuestaError, onAuthStateChange:function(){ return {data:{subscription:{unsubscribe(){}}}}; } };
      return function(){ return cadenaSegura(); };
    }});
  }
}

function mensajeError(err, fallback){ return (err && err.message) ? err.message : (fallback||'error desconocido'); }

function capitalizar(s){ return String(s||'').trim().split(/\s+/).map(w=>w? w[0].toUpperCase()+w.slice(1).toLowerCase():w).join(' '); }

/* ---------- tasa BCV-Euro (para pagos en bolívares) ---------- */
let TASA_EUR_BCV = null;   // tasa oficial descargada
let TASA_MANUAL = null;    // tasa fijada a mano para el día (tiene prioridad)
async function obtenerTasaEuroBcv(){
  try{
    const res = await fetch('https://ve.dolarapi.com/v1/euros/oficial');
    if(!res.ok) throw new Error('bcv');
    const data = await res.json();
    TASA_EUR_BCV = Number(data.promedio) || null;
  }catch(e){ console.error('No se pudo obtener la tasa BCV-Euro', e); }
  return TASA_EUR_BCV;
}
// La tasa manual del día manda sobre la oficial
function tasaVigente(){ return TASA_MANUAL || TASA_EUR_BCV; }
function etiquetaTasa(){ return TASA_MANUAL ? 'tasa del día' : 'tasa BCV-Euro'; }
function esMetodoBolivares(m){ return m==='efectivo_bs' || m==='pago_movil' || m==='transferencia'; }
// Devuelve solo el número en bolívares, sin símbolo monetario
function fmtBcvEuro(montoUsd){
  const t = tasaVigente();
  if(!t) return null;
  return (Number(montoUsd)*t).toFixed(2);
}
// Línea completa "Total Bs.: X (tasa BCV-Euro)" para mostrar bajo los totales
function lineaTotalBs(montoUsd, metodo){
  if(!esMetodoBolivares(metodo)) return '';
  const bs = fmtBcvEuro(montoUsd);
  return bs ? ('Total Bs.: ' + bs + '  (' + etiquetaTasa() + ')') : '';
}
function fmtFecha(d){ if(!d) return '—'; var dt = new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('es-VE',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtFechaHora(d){ if(!d) return '—'; var dt = new Date(d); if(isNaN(dt)) return d; return dt.toLocaleString('es-VE',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function labelTipoVeh(t){ return {moto:'Moto',carro:'Carro',camioneta:'Camioneta',otro:'Otro'}[t]||t||''; }
function labelMetodoPago(m){ return {efectivo:'Efectivo',efectivo_bs:'Efectivo (Bs)',efectivo_divisa:'Efectivo (Divisa)',pago_movil:'Pago móvil',transferencia:'Transferencia',tarjeta:'Tarjeta',zelle:'Zelle',credito:'Crédito',contado:'Contado'}[m]||m||''; }
const METODOS_PAGO = [['efectivo_bs','Efectivo (Bs)'],['efectivo_divisa','Efectivo (Divisa)'],['pago_movil','Pago móvil'],['transferencia','Transferencia'],['tarjeta','Tarjeta'],['zelle','Zelle'],['credito','Crédito (a la cuenta del cliente)']];
function opcionesMetodoPago(seleccionado){
  return METODOS_PAGO.map(([v,l])=>`<option value="${v}" ${seleccionado===v?'selected':''}>${esc(l)}</option>`).join('');
}
function badge(estado, labelMap){
  var label = (labelMap && labelMap[estado]) || capitalizar(String(estado||'').replace(/_/g,' '));
  return '<span class="badge b-'+esc(estado)+'">'+esc(label)+'</span>';
}
function emptyState(icon, text){ return '<div class="empty-state"><i data-ic="'+icon+'"></i><div>'+esc(text)+'</div></div>'; }

/* ---------- formato en vivo: nombres en Título y teléfonos +58 ---------- */
function capitalizarLive(s){ return s.replace(/\S+/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()); }
function normalizarTelefonoVE(raw){
  let v = String(raw||'').replace(/[^\d+]/g,'').replace(/(?!^)\+/g,'');
  let digits = v.replace(/\+/g,'');
  if(digits.startsWith('58')) digits = digits.slice(2);
  else if(digits.startsWith('0')) digits = digits.slice(1);
  digits = digits.slice(0,10);
  if(digits.length===0) return '';
  if(digits.length<=3) return '+58 '+digits;
  return '+58 '+digits.slice(0,3)+digits.slice(3);
}
function telefonoWhatsapp(tel){
  let d = String(tel||'').replace(/\D/g,'');
  if(d.startsWith('58')) return d;
  if(d.startsWith('0')) return '58'+d.slice(1);
  return '58'+d;
}
document.addEventListener('input', function(e){
  var el = e.target;
  if(!el || !el.tagName) return;
  if(el.tagName==='INPUT' && el.type==='tel'){
    var v = normalizarTelefonoVE(el.value);
    el.value = v; el.setSelectionRange(v.length, v.length);
  } else if(el.dataset && el.dataset.cap==='nombre'){
    var pos = el.selectionStart;
    el.value = capitalizarLive(el.value);
    el.setSelectionRange(pos, pos);
  }
});

/* Toast */
let toastTimer=null;
function toast(msg, isErr){
  var t = document.getElementById('toast');
  t.innerHTML = '<i data-ic="'+(isErr?'alert-triangle':'check')+'"></i><span>'+esc(msg)+'</span>';
  drawIcons(t);
  t.className = 'toast show' + (isErr?' err':'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className='toast'; }, 3200);
}

/* Modal (formularios) */
function abrirModal(titulo, innerHtml, ancho){
  var root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box glass-solid" style="${ancho?('max-width:'+ancho+';'):''}">
        <div class="modal-head"><h3>${esc(titulo)}</h3><button class="modal-close" id="modalCloseBtn"><i data-ic="x"></i></button></div>
        ${innerHtml}
      </div>
    </div>`;
  drawIcons(root);
  requestAnimationFrame(()=> document.getElementById('modalOverlay').classList.add('show'));
  document.getElementById('modalCloseBtn').addEventListener('click', cerrarModal);
  document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target.id==='modalOverlay') cerrarModal(); });
}
function cerrarModal(){
  var ov = document.getElementById('modalOverlay'); if(!ov) return;
  ov.classList.remove('show');
  setTimeout(()=>{ document.getElementById('modalRoot').innerHTML=''; }, 250);
}

async function hacerLogin(){
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  var err = document.getElementById('loginError');
  var btn = document.getElementById('btnLogin');
  err.textContent='';

  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Ingresando…';
  const {data, error} = await sb.auth.signInWithPassword({email, password:pass});

async function cargarSesion(session){

  const {data: perfil, error} = await sb.from('perfiles').select('*').eq('id', session.user.id).single();

  const {data: cfg} = await sb.from('config_general').select('*').eq('id',1).single();

async function mostrarAperturaCaja(){
  const {data, error} = await sb.rpc('estado_caja_hoy');
  if(error){ console.error('No se pudo leer la caja', error); return; }
  if(data && data.tasa_manual_hoy) TASA_MANUAL = Number(data.tasa_manual_hoy);
  const montoAnterior = Number(data?.monto_anterior || 0);
  const fechaAnterior = data?.fecha_anterior;
  const tasaSugerida = TASA_MANUAL || TASA_EUR_BCV;
  abrirModal('Apertura de caja', `
    <div class="saldo-hero glass" style="margin-bottom:14px;">
      <div class="amt mono">${fmtUsd(montoAnterior)}</div>
      <div class="lbl">${fechaAnterior ? ('Monto en caja del '+fmtFecha(fechaAnterior)) : 'Sin registro de días anteriores'}</div>
    </div>
    <label class="field-label" style="margin-top:0;">Monto en caja de hoy (USD)</label>
    <input type="number" step="0.01" id="cjMonto" value="${Number(data?.monto_hoy||montoAnterior).toFixed(2)}">
    <label class="field-label">Tasa del día (Bs. por USD)</label>
    <input type="number" step="0.0001" id="cjTasa" value="${tasaSugerida ? Number(tasaSugerida).toFixed(4) : ''}" placeholder="${TASA_EUR_BCV?Number(TASA_EUR_BCV).toFixed(4):'Sin conexión con el BCV'}">
    <div class="help-text">Viene precargada con la tasa BCV-Euro${TASA_EUR_BCV?(' de hoy ('+Number(TASA_EUR_BCV).toFixed(2)+')'):''}. Si la cambias, esa tasa manual se usará en todos los cobros hasta el final del día.</div>
    <label class="field-label">Notas (opcional)</label>
    <input type="text" id="cjNotas" placeholder="Ej: faltante, sobrante, observación…">
    <div class="modal-actions">
      <button class="btn btn-glass btn-block" id="cjOmitir">Ahora no</button>
      <button class="btn btn-primary btn-block" id="cjGuardar">Abrir caja</button>
    </div>
  `);
  document.getElementById('cjOmitir').addEventListener('click', cerrarModal);
  document.getElementById('cjGuardar').addEventListener('click', async function(){
    const btn=this; btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Guardando…';
    const monto = Number(document.getElementById('cjMonto').value)||0;
    const tasaEscrita = Number(document.getElementById('cjTasa').value)||null;
    // Solo se guarda como "manual" si difiere de la tasa oficial
    const tasaManual = (tasaEscrita && TASA_EUR_BCV && Math.abs(tasaEscrita - TASA_EUR_BCV) < 0.0001) ? null : tasaEscrita;
    const {error} = await sb.rpc('abrir_caja_dia', {p_monto: monto, p_tasa: tasaManual, p_notas: document.getElementById('cjNotas').value.trim()||null});
    if(error){ toast('No se pudo abrir la caja: '+mensajeError(error), true); btn.disabled=false; btn.innerHTML='Abrir caja'; return; }
    TASA_MANUAL = tasaManual;
    toast('Caja abierta'); cerrarModal();
    if(VISTA_ACTUAL==='resumen') cargarResumen();
  });
}

function construirNav(){
  var items = navVisible();
  var grupos = {};
  items.forEach(i=>{ (grupos[i.group]=grupos[i.group]||[]).push(i); });

      html += `<button class="nav-item" data-nav="${i.id}"><i data-ic="${i.icon}"></i>${esc(i.label)}</button>`;
    });

  var side = document.getElementById('sideNav');

  side.querySelectorAll('[data-nav]').forEach(b=> b.addEventListener('click', ()=> irA(b.dataset.nav)));

  var dockHtml = dockItems.map(i=>`<button class="dock-item" data-nav="${i.id}"><i data-ic="${i.icon}"></i><span>${esc(i.label)}</span></button>`).join('');
  dockHtml += `<button class="dock-item" id="dockMasBtn"><i data-ic="more-horizontal"></i><span>Más</span></button>`;
  var dock = document.getElementById('dockNav');
  dock.innerHTML = dockHtml; drawIcons(dock);

  document.getElementById('dockMasBtn').addEventListener('click', abrirSheetMas);
  document.getElementById('btnMoreDesktop').style.display='none';

function abrirSheetMas(){
  var items = navVisible().filter(i=> !DOCK_IDS.includes(i.id));
  var grupos = {};
  items.forEach(i=>{ (grupos[i.group]=grupos[i.group]||[]).push(i); });
  var html='<div class="stack-sm">';
  Object.keys(grupos).forEach(g=>{
    html += `<div class="nav-group-label" style="padding-left:0;">${esc(g)}</div>`;
    grupos[g].forEach(i=>{
      html += `<button class="sheet-nav-item" data-nav="${i.id}"><i data-ic="${i.icon}"></i>${esc(i.label)}</button>`;
    });

function irA(vista){
  if(!navVisible().find(n=>n.id===vista)) return;

async function buscarOCrearCliente(telefono, nombre){
  telefono = String(telefono||'').trim();
  if(!telefono) return {data:null, error:{message:'El teléfono es obligatorio'}};
  const {data: existente} = await sb.from('clientes').select('*').eq('telefono', telefono).maybeSingle();
  if(existente){
    if(nombre && !existente.nombre){ await sb.from('clientes').update({nombre: capitalizar(nombre)}).eq('id', existente.id); existente.nombre = capitalizar(nombre); }
    return {data: existente, error: null};
  }
  const {data, error} = await sb.from('clientes').insert({telefono, nombre: nombre?capitalizar(nombre):null}).select().single();
  return {data, error};
}

/* ---------- Autocompletado de clientes ya registrados ----------
   Permite escoger un cliente del historial o escribirlo nuevo.
   campoBuscarClienteHTML(id) devuelve el HTML; initBuscarCliente(id, cb)
   lo activa y llama cb(cliente) al elegir uno de la lista. */
function campoBuscarClienteHTML(id, etiqueta){

    <div class="ac-wrap">
      <input type="text" id="${id}" placeholder="Escribe el nombre o teléfono…" autocomplete="off">
      <div class="ac-list" id="${id}List"></div>

function initBuscarCliente(id, onSelect){
  const input = document.getElementById(id);
  const lista = document.getElementById(id+'List');
  if(!input || !lista) return;
  let temporizador = null;
  function ocultar(){ lista.classList.remove('show'); lista.innerHTML=''; }
  input.addEventListener('input', function(){
    const texto = input.value.trim();
    clearTimeout(temporizador);
    if(texto.length < 2){ ocultar(); return; }
    temporizador = setTimeout(async function(){
      const {data} = await sb.from('clientes').select('*')
        .or(`nombre.ilike.%${texto}%,telefono.ilike.%${texto}%`).order('nombre').limit(8);
      if(!data || data.length===0){
        lista.innerHTML = '<div class="ac-empty">Sin coincidencias — se registrará como cliente nuevo</div>';
        lista.classList.add('show'); return;
      }
      lista.innerHTML = data.map((cl,i)=>`
        <div class="ac-item" data-i="${i}">
          <div class="a1">${esc(cl.nombre||'Sin nombre')}</div>
          <div class="a2">${esc(cl.telefono)}</div>
        </div>`).join('');
      lista.classList.add('show');
      lista.querySelectorAll('.ac-item').forEach(el=> el.addEventListener('click', function(){
        const cl = data[Number(this.dataset.i)];
        input.value = (cl.nombre||'') + ' · ' + cl.telefono;
        ocultar();
        if(onSelect) onSelect(cl);
      }));
    }, 250);
  });
  input.addEventListener('blur', ()=> setTimeout(ocultar, 180));
}

// Se asegura de que el total de un lavado quede registrado como deuda base
// (crédito) la primera vez que se toca su cuenta — así un abono parcial
// siempre queda descontando de algo, en vez de aparecer como "a favor".
// Si ya existe algún movimiento para ese lavado, no hace nada.
async function asegurarObligacionLavado(lavadoId, clienteId, total){
  if(!clienteId || !total) return false;
  const {data: existentes} = await sb.from('movimientos_cuenta_cliente')
    .select('id').eq('referencia_lavado_id', lavadoId).eq('anulado', false).limit(1);
  if(existentes && existentes.length) return false;
  await registrarMovimientoCuenta(clienteId, 'credito', total, 'Total de la factura', {referencia_lavado_id: lavadoId});
  return true;
}
async function sumarSelloFidelidad(cliente_id){
  if(!cliente_id) return;
  let {data: tarjeta} = await sb.from('tarjetas_fidelidad').select('*').eq('cliente_id', cliente_id).maybeSingle();
  if(!tarjeta){
    const {data} = await sb.from('tarjetas_fidelidad').insert({cliente_id}).select().single();
    tarjeta = data;
  }
  if(!tarjeta) return;
  const umbral = CONFIG_GENERAL.umbral_fidelidad_sellos || 6;
  let nuevoSellos = (tarjeta.sellos||0) + 1;
  let nuevosGratis = tarjeta.lavados_gratis_disponibles||0;
  if(nuevoSellos >= umbral){ nuevoSellos = 0; nuevosGratis += 1; }
  await sb.from('tarjetas_fidelidad').update({sellos:nuevoSellos, lavados_gratis_disponibles:nuevosGratis}).eq('id', tarjeta.id);
  if(nuevosGratis > (tarjeta.lavados_gratis_disponibles||0)) toast('¡Sello completado! Se otorgó un lavado gratis 🎉');
}

async function cargarResumen(){
  var c = document.getElementById('content');
  c.innerHTML = `<div class="stat-grid" id="statGrid"></div>
    <div class="section-head"><h2>Actividad reciente</h2></div>
    <div class="card-list" id="listaReciente"><div class="empty-state">Cargando…</div></div>
    <div class="section-head" style="margin-top:22px;"><h2>Salida de productos y repuestos</h2></div>
    <div class="card-list" id="listaSalidaProductos"><div class="empty-state">Cargando…</div></div>`;
  const inicioHoy = hoy()+'T00:00:00';
  const [lavHoy, citasHoy, prodBajo, lavRecientes, ventasHoy, extrasHoy] = await Promise.all([
    sb.from('lavados').select('id,precio_usd,estado,anulado').gte('fecha_lavado', inicioHoy).eq('anulado', false),
    sb.from('citas').select('id,estado').eq('fecha', hoy()),
    sb.from('productos').select('id,stock,stock_minimo').eq('activo', true),
    sb.from('lavados').select('*').order('created_at',{ascending:false}).limit(6),
    sb.from('ventas_productos').select('total_usd,anulado').gte('created_at', inicioHoy).eq('anulado', false),
    sb.from('lavado_extras').select('subtotal_usd,tipo').gte('created_at', inicioHoy)
  ]);
  const lavadosHoy = lavHoy.data||[];
  const ingresosLavados = lavadosHoy.filter(l=>['completado','pagado'].includes(l.estado)).reduce((a,b)=>a+Number(b.precio_usd||0),0);
  const ingresosVentas = (ventasHoy.data||[]).reduce((a,b)=>a+Number(b.total_usd||0),0);
  const ingresosExtras = (extrasHoy.data||[]).reduce((a,b)=>a+Number(b.subtotal_usd||0),0);
  const citasHoyCount = (citasHoy.data||[]).length;
  const bajoStock = (prodBajo.data||[]).filter(p=> Number(p.stock) <= Number(p.stock_minimo)).length;

  var stats = [
    {ic:'droplet', val: lavadosHoy.length, lbl:'Lavados hoy'},
    {ic:'banknote', val: fmtUsd(ingresosLavados), lbl:'Ingresos por lavados hoy'},
    {ic:'shopping-cart', val: fmtUsd(ingresosVentas + ingresosExtras), lbl:'Ingresos por productos hoy'},
    {ic:'calendar', val: citasHoyCount, lbl:'Citas para hoy'},
    {ic:'package-search', val: bajoStock, lbl:'Productos con stock bajo'},
    {ic:'wallet', val: fmtUsd(ingresosLavados + ingresosVentas + ingresosExtras), lbl:'Total facturado hoy'},
  ];
  // Tasa vigente del día (manual si el jefe la fijó al abrir caja)
  if(tasaVigente()){
    stats.push({ic:'banknote', val: Number(tasaVigente()).toFixed(2), lbl: TASA_MANUAL?'Tasa del día (manual)':'Tasa BCV-Euro'});
  }
  if(esJefeOAdmin()){
    const [cxp, creditos] = await Promise.all([
      sb.from('cuentas_por_pagar').select('monto_total_usd,monto_pagado_usd,estado').neq('estado','pagada'),
      sb.from('movimientos_cuenta_cliente').select('tipo,monto_usd').eq('anulado', false)
    ]);
    const cxpPendiente = (cxp.data||[]).reduce((a,b)=>a+(Number(b.monto_total_usd)-Number(b.monto_pagado_usd)),0);
    const saldoClientes = (creditos.data||[]).reduce((a,b)=> a + (b.tipo==='credito'?Number(b.monto_usd):-Number(b.monto_usd)), 0);
    stats.push({ic:'receipt', val: fmtUsd(cxpPendiente), lbl:'Por pagar a proveedores'});
    stats.push({ic:'credit-card', val: fmtUsd(saldoClientes), lbl:'Por cobrar a clientes'});
  }
  document.getElementById('statGrid').innerHTML = stats.map(s=>`
    <div class="stat-card glass"><div class="ic"><i data-ic="${s.ic}"></i></div><div class="val mono">${esc(s.val)}</div><div class="lbl">${esc(s.lbl)}</div></div>
  `).join('');

  const lista = document.getElementById('listaReciente');
  const recientes = lavRecientes.data||[];
  if(recientes.length===0){ lista.innerHTML = emptyState('droplet','Todavía no hay lavados registrados'); }
  else{
    lista.innerHTML = recientes.map(l=>`
      <div class="item-row glass st-${esc(l.estado)}">
        <span class="info">
          <span class="t1">${esc(l.nombre_cliente)} ${badge(l.estado)}</span>
          <span class="t2">${esc(labelTipoVeh(l.tipo_vehiculo))} · ${esc(labelMetodoPago(l.metodo_pago))} · ${fmtFechaHora(l.fecha_lavado)}</span>
        </span>
        <span class="amt mono">${fmtUsd(l.precio_usd)}</span>
      </div>
    `).join('');
  }
  pintarSalidaProductos(); // corre en paralelo: no bloquea el resto del resumen
  drawIcons(c);
}

  ]);
  const filas = [];
  (ventas.data||[]).forEach(v=>{
    const detalle = (v.venta_items||[]).map(i=>`${i.productos?.nombre||'Producto'} × ${Number(i.cantidad)}`).join(', ');
    filas.push({fecha:v.created_at, titulo:v.nombre_cliente||'Venta de mostrador', etiqueta:'Mostrador',
      detalle: detalle || 'Venta de productos', metodo:labelMetodoPago(v.metodo_pago), monto:v.total_usd});
  });
  (extras.data||[]).forEach(e=>{
    filas.push({fecha:e.created_at, titulo:e.lavados?.nombre_cliente||'Cliente', etiqueta:'En lavado',
      detalle:`${e.descripcion} × ${Number(e.cantidad)}`, metodo:null, monto:e.subtotal_usd});
  });
  filas.sort((a,b)=> new Date(b.fecha) - new Date(a.fecha));
  const top = filas.slice(0,12);
  if(top.length===0){ cont.innerHTML = emptyState('box','Todavía no hay salida de productos ni repuestos'); drawIcons(cont); return; }
  cont.innerHTML = top.map(f=>`
    <div class="item-row glass st-completada">
      <span class="info">
        <span class="t1">${esc(f.titulo)} <span class="chip">${esc(f.etiqueta)}</span></span>
        <span class="t2">${esc(f.detalle)}${f.metodo?(' · '+esc(f.metodo)):''} · ${fmtFechaHora(f.fecha)}</span>
      </span>
      <span class="amt mono">${fmtUsd(f.monto)}</span>
    </div>`).join('');
  drawIcons(cont);
}

async function cargarLavados(){
  var c = document.getElementById('content');
  c.innerHTML = `
    <div class="section-head"><h2>Lavados</h2><button class="btn btn-primary btn-sm" id="btnNuevoLavado"><i data-ic="plus"></i>Nuevo lavado</button></div>
    <div class="filters-row">
      <select id="fLavEstado"><option value="">Todos los estados</option><option value="en_proceso">En proceso</option><option value="completado">Completados</option><option value="anulado">Anulados</option></select>
      <input type="date" id="fLavFecha" value="${hoy()}">
      <button class="btn btn-glass btn-sm" id="fLavHoyClear">Ver todos</button>
    </div>
    <div class="card-list" id="listaLavados"></div>`;
  drawIcons(c);
  document.getElementById('btnNuevoLavado').addEventListener('click', ()=> modalNuevoLavado());
  document.getElementById('fLavHoyClear').addEventListener('click', ()=>{ document.getElementById('fLavFecha').value=''; buscarLavados(); });
  document.getElementById('fLavEstado').addEventListener('change', buscarLavados);
  document.getElementById('fLavFecha').addEventListener('change', buscarLavados);
  buscarLavados();
}
async function buscarLavados(){
  const cont = document.getElementById('listaLavados');
  cont.innerHTML = '<div class="empty-state">Cargando…</div>';
  let q = sb.from('lavados').select('*').order('fecha_lavado',{ascending:false}).limit(120);
  const est = document.getElementById('fLavEstado').value;
  const fecha = document.getElementById('fLavFecha').value;
  if(est) q = q.eq('estado', est);
  if(fecha) q = q.gte('fecha_lavado', fecha+'T00:00:00').lte('fecha_lavado', fecha+'T23:59:59');
  const {data, error} = await q;
  if(error){ cont.innerHTML = `<div class="error-state">No se pudo cargar: ${esc(mensajeError(error))}</div>`; return; }
  if(!data || data.length===0){ cont.innerHTML = emptyState('droplet','No hay lavados con estos filtros'); return; }
  let extrasMap = {};
  if(data.length){
    const {data: extrasData} = await sb.from('lavado_extras').select('lavado_id, subtotal_usd').in('lavado_id', data.map(l=>l.id));
    (extrasData||[]).forEach(e=>{
      const m = extrasMap[e.lavado_id] || {total:0, count:0};
      m.total += Number(e.subtotal_usd); m.count += 1;
      extrasMap[e.lavado_id] = m;
    });
  }
  cont.innerHTML = data.map(l=>{
    const extra = extrasMap[l.id];
    const totalTicket = Number(l.precio_usd) + (extra?extra.total:0);
    return `
    <div class="item-row glass st-${esc(l.estado)}">
      <span class="info">
        <span class="t1">${esc(l.nombre_cliente)} ${badge(l.estado)}</span>
        <span class="t2">${esc(labelTipoVeh(l.tipo_vehiculo))}${l.placa?(' · '+esc(l.placa)):''} · ${esc(labelMetodoPago(l.metodo_pago))} · ${fmtFechaHora(l.fecha_lavado)}${l.telefono?(' · '+esc(l.telefono)):''}</span>
        ${extra?`<span class="t2">+ ${extra.count} producto(s)/servicio(s) del ticket (${fmtUsd(extra.total)})</span>`:''}
        ${l.anulado?`<span class="t2" style="color:var(--red);">Anulado: ${esc(l.anulado_motivo||'')}</span>`:''}
      </span>
      <span class="amt mono">${fmtUsd(totalTicket)}</span>
      <span class="acts">
        ${l.estado==='en_proceso'?`<button class="btn btn-primary btn-sm" onclick='completarLavado(${JSON.stringify(l)})'>Completar</button>`:''}
        ${!l.anulado?`<button class="btn btn-glass btn-sm" onclick='abrirTicketLavado(${JSON.stringify(l)})'><i data-ic="receipt"></i>Ticket</button>`:''}
        ${!l.anulado?`<button class="btn btn-danger btn-sm" onclick="pedirAnularLavado('${l.id}')">Anular</button>`:''}
      </span>
    </div>
  `;}).join('');
  drawIcons(cont);
}
async function completarLavado(lavado){
  const {error} = await sb.from('lavados').update({estado:'completado'}).eq('id', lavado.id);
  if(error){ toast('No se pudo completar: '+mensajeError(error), true); return; }
  if(lavado.cliente_id) await sumarSelloFidelidad(lavado.cliente_id);
  toast('Lavado marcado como completado');
  buscarLavados();
  if(lavado.telefono) abrirDialogoNotificarCliente(lavado);
}
function construirMensajeListo(lavado){
  const nombreCorto = capitalizarLive((lavado.nombre_cliente||'').trim().split(/\s+/)[0] || '');
  const vehLabel = labelTipoVeh(lavado.tipo_vehiculo).toLowerCase();
  const vehEmoji = {moto:'🏍️', carro:'🚗', camioneta:'🚙', otro:'🚘'}[lavado.tipo_vehiculo] || '🚘';
  return `¡Hola ${nombreCorto}! 👋✨\n\nTu ${vehLabel} ${vehEmoji} ya está listo, quedó limpio y reluciente 🧼💦\n\n¡Ya puedes pasar a retirarlo cuando gustes! ✅🙌\n\nGracias por confiar en *Máquinas Autoservicios* 💚🚿\n¡Te esperamos pronto en tu próxima visita! 🔁😄`;
}
function abrirDialogoNotificarCliente(lavado){

    <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 4px;">¿Deseas notificarle a <b style="color:var(--ink);">${esc(lavado.nombre_cliente||'el cliente')}</b> que su vehículo ya está listo?</p>
    <div class="modal-actions">
      <button class="btn btn-glass btn-block" id="btnNoNotificar">No</button>
      <button class="btn btn-primary btn-block" id="btnSiNotificar"><i data-ic="phone"></i>Notificar</button>
    </div>
  `);
  drawIcons(document.getElementById('modalRoot'));
  document.getElementById('btnNoNotificar').addEventListener('click', cerrarModal);
  document.getElementById('btnSiNotificar').addEventListener('click', function(){
    const url = 'https://wa.me/'+telefonoWhatsapp(lavado.telefono)+'?text='+encodeURIComponent(construirMensajeListo(lavado));
    window.open(url, '_blank');
    cerrarModal();

function pedirAnularLavado(id){
  pedirCodigoAutorizacion('Anular lavado',
    'Esta acción anulará el recibo del lavado y repondrá el stock de los productos facturados.',
    async (codigo, motivoCodigo)=>{
      if(codigo === null){
        // Jefe o admin: solo pide el motivo
        confirmarAccion('Anular lavado', 'Esta acción anulará el recibo del lavado. Escribe el motivo.', 'Anular lavado', async (motivo)=>{
          const {error} = await sb.rpc('anular_lavado_autorizado', {p_id:id, p_motivo:motivo, p_codigo:null});
          if(error){ toast('No se pudo anular: '+mensajeError(error), true); return; }
          toast('Lavado anulado'); cerrarModal(); buscarLavados();
        }, true);
        return;
      }
      const {error} = await sb.rpc('anular_lavado_autorizado', {p_id:id, p_motivo:motivoCodigo, p_codigo:codigo});
      if(error){ toast('No se pudo anular: '+mensajeError(error), true); return; }
      toast('Lavado anulado'); cerrarModal(); buscarLavados();
    });
}

/* =====================================================================
   TICKET DEL LAVADO — agregar productos/servicios extra, cobro/abono,
   método de pago e impresión del recibo (impresora de tickets)
===================================================================== */
async function abrirTicketLavado(lavado){
  const [{data: extras}, {data: productos}, {data: servicios}, {data: movs}] = await Promise.all([
    sb.from('lavado_extras').select('*').eq('lavado_id', lavado.id).order('created_at'),
    sb.from('productos').select('*').eq('activo', true).gt('stock',0).order('nombre'),
    sb.from('servicios').select('*').eq('activo', true).order('nombre'),
    lavado.cliente_id
      ? sb.from('movimientos_cuenta_cliente').select('*').eq('referencia_lavado_id', lavado.id).eq('anulado', false).order('created_at')
      : Promise.resolve({data:[]})
  ]);
  const listaExtras = extras || [];
  const listaMovs = movs || [];
  const total = Number(lavado.precio_usd) + listaExtras.reduce((a,b)=>a+Number(b.subtotal_usd),0);
  // El abono descuenta de lo pendiente. El saldo pendiente real es el neto
  // (crédito - débito) de los movimientos de este lavado: así un abono
  // parcial queda "debiendo" el resto, en vez de aparecer como "a favor".
  const abonado = listaMovs.filter(m=>m.tipo==='debito').reduce((a,b)=>a+Number(b.monto_usd),0);
  const netoCliente = listaMovs.reduce((a,m)=> a + (m.tipo==='credito'? Number(m.monto_usd) : -Number(m.monto_usd)), 0);
  const saldoPendiente = listaMovs.length===0 ? total : Math.max(0, netoCliente);
  const facturaAbierta = lavado.estado !== 'pagado' && !lavado.anulado;
  const opcionesProd = (productos||[]).map(p=>`<option value="${p.id}" data-precio="${p.precio_usd}" data-nombre="${esc(p.nombre)}">${esc(p.nombre)} — ${fmtUsd(p.precio_usd)}</option>`).join('');
  const opcionesServ = (servicios||[]).map(s=>`<option value="${s.id}" data-precio="${s.precio_usd}" data-nombre="${esc(s.nombre)}">${esc(s.nombre)} — ${fmtUsd(s.precio_usd)}</option>`).join('');

  abrirModal('Ticket del lavado', `
    <div class="chip" style="margin-bottom:12px;">${esc(lavado.nombre_cliente)} · ${esc(labelTipoVeh(lavado.tipo_vehiculo))}${lavado.placa?(' · '+esc(lavado.placa)):''} ${badge(lavado.estado)}</div>
    <div class="item-row glass" style="margin-bottom:8px;">
      <span class="info"><span class="t1">Lavado</span><span class="t2">Servicio base</span></span>
      <span class="amt mono">${fmtUsd(lavado.precio_usd)}</span>
    </div>
    <div id="ticketExtrasLista">
      ${listaExtras.map(e=>`
        <div class="item-row glass" style="margin-bottom:8px;">
          <span class="info"><span class="t1">${esc(e.descripcion)}</span><span class="t2">${e.cantidad>1?(e.cantidad+' × '+fmtUsd(e.precio_unitario_usd)):(e.tipo==='producto'?'Producto':'Servicio adicional')}</span></span>
          <span class="amt mono">${fmtUsd(e.subtotal_usd)}</span>
          <button class="btn btn-ghost btn-icon quitar-extra" data-id="${e.id}" type="button"><i data-ic="trash-2"></i></button>
        </div>`).join('')}
    </div>
    ${facturaAbierta?`
    <div class="divider"></div>
    <label class="field-label" style="margin-top:0;">Agregar producto (repuesto, consumible o accesorio)</label>
    <select id="tkProducto"><option value="">Selecciona un producto…</option>${opcionesProd}</select>
    <div class="form-row2" style="margin-top:8px;">
      <input type="number" step="0.01" id="tkCantidad" placeholder="Cantidad" value="1">
      <button class="btn btn-glass" id="btnAgregarExtraProducto" type="button"><i data-ic="plus"></i>Agregar</button>
    </div>
    <label class="field-label">Agregar otro servicio</label>
    <select id="tkServicio"><option value="">Selecciona un servicio…</option>${opcionesServ}</select>
    <button class="btn btn-glass btn-block" id="btnAgregarExtraServicio" type="button" style="margin-top:8px;"><i data-ic="plus"></i>Agregar servicio</button>
    `:''}
    <div class="divider"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-weight:700;font-size:13.5px;">Total a cobrar</span>
      <span class="amt mono" style="font-size:19px;">${fmtUsd(total)}</span>
    </div>
    ${abonado>0?`<div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px;">
      <span style="font-size:12.5px;color:var(--g1);font-weight:600;">Abonado</span>
      <span class="amt mono" style="font-size:13.5px;color:var(--g1);">− ${fmtUsd(abonado)}</span>
    </div>`:''}
    ${listaMovs.length>0?`<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);">
      <span style="font-weight:800;font-size:13.5px;">Saldo pendiente</span>
      <span class="amt mono" style="font-size:17px;color:${saldoPendiente>0?'var(--amber)':'var(--g1)'};">${fmtUsd(saldoPendiente)}</span>
    </div>`:''}
    <div id="tkTotalBs" class="help-text" style="text-align:right;margin-top:-4px;"></div>
    <label class="field-label">Método de pago</label>
    <select id="tkMetodo">${opcionesMetodoPago(lavado.metodo_pago)}</select>
    ${facturaAbierta?`
      <button class="btn btn-primary btn-block" id="btnMarcarPagadoTicket" type="button" style="margin-top:16px;"><i data-ic="check"></i>Marcar como pagado (cerrar factura)</button>
      <button class="btn btn-glass btn-block" id="btnFinanciarTicket" type="button" style="margin-top:10px;"><i data-ic="credit-card"></i>Financiar / Fiado (cerrar a crédito)</button>
    `:`<div class="chip" style="margin-top:16px;">🔒 Factura cerrada — ${lavado.metodo_pago==='credito'?'financiada':'pagada'}</div>`}
    <div class="form-row2" style="margin-top:10px;">
      <button class="btn btn-glass" id="btnCobroAbono" type="button"><i data-ic="credit-card"></i>Cobro / Abono</button>
      <button class="btn btn-glass" id="btnImprimirRecibo" type="button"><i data-ic="receipt"></i>Imprimir</button>
    </div>
    <button class="btn btn-glass btn-block" id="btnActualizarTicket" type="button" style="margin-top:10px;"><i data-ic="refresh-cw"></i>Actualizar y cerrar</button>
  `, '480px');
  drawIcons(document.getElementById('modalRoot'));
  function pintarTotalBsTicket(){
    const cont = document.getElementById('tkTotalBs');
    const metodo = document.getElementById('tkMetodo').value;
    cont.textContent = lineaTotalBs(saldoPendiente, metodo);
  }
  pintarTotalBsTicket();

  document.querySelectorAll('.quitar-extra').forEach(btn=> btn.addEventListener('click', function(){
    const idExtra = this.dataset.id;
    // Factura abierta y con permisos: se quita directo. En cualquier otro
    // caso (vendedor, o factura ya cerrada) se pide el código del jefe.
    if(facturaAbierta && esJefeOAdmin()){
      sb.rpc('eliminar_extra_autorizado', {p_id:idExtra, p_codigo:null}).then(({error})=>{
        if(error){ toast('No se pudo quitar: '+mensajeError(error), true); return; }
        toast('Ítem quitado del ticket'); refrescarListadoDeFondo(); abrirTicketLavado(lavado);
      });
      return;
    }
    pedirCodigoAutorizacion('Quitar producto de la factura',
      'Se quitará este ítem del ticket y se repondrá al inventario.',
      async (codigo)=>{
        const {error} = await sb.rpc('eliminar_extra_autorizado', {p_id:idExtra, p_codigo:codigo});
        if(error){ toast('No se pudo quitar: '+mensajeError(error), true); return; }
        toast('Ítem quitado del ticket'); refrescarListadoDeFondo(); abrirTicketLavado(lavado);
      });
  }));
  const btnProd = document.getElementById('btnAgregarExtraProducto');
  if(btnProd) btnProd.addEventListener('click', async function(){
    const sel = document.getElementById('tkProducto'); const opt = sel.selectedOptions[0];
    const cantidad = Number(document.getElementById('tkCantidad').value)||0;
    if(!opt || !opt.value || cantidad<=0){ toast('Selecciona un producto y una cantidad válida', true); return; }
    const precio = Number(opt.dataset.precio);
    const {error} = await sb.from('lavado_extras').insert({lavado_id:lavado.id, tipo:'producto', producto_id:opt.value, descripcion:opt.dataset.nombre, cantidad, precio_unitario_usd:precio, subtotal_usd:precio*cantidad, creado_por:PERFIL.id});
    if(error){ toast('No se pudo agregar: '+mensajeError(error), true); return; }
    toast('Producto agregado al ticket'); refrescarListadoDeFondo(); abrirTicketLavado(lavado);
  });
  const btnServ = document.getElementById('btnAgregarExtraServicio');
  if(btnServ) btnServ.addEventListener('click', async function(){
    const sel = document.getElementById('tkServicio'); const opt = sel.selectedOptions[0];
    if(!opt || !opt.value){ toast('Selecciona un servicio', true); return; }
    const precio = Number(opt.dataset.precio);
    const {error} = await sb.from('lavado_extras').insert({lavado_id:lavado.id, tipo:'servicio', servicio_id:opt.value, descripcion:opt.dataset.nombre, cantidad:1, precio_unitario_usd:precio, subtotal_usd:precio, creado_por:PERFIL.id});
    if(error){ toast('No se pudo agregar: '+mensajeError(error), true); return; }
    toast('Servicio agregado al ticket'); refrescarListadoDeFondo(); abrirTicketLavado(lavado);
  });
  document.getElementById('tkMetodo').addEventListener('change', async function(){
    const {error} = await sb.from('lavados').update({metodo_pago:this.value}).eq('id', lavado.id);
    if(error){ toast('No se pudo actualizar: '+mensajeError(error), true); return; }
    lavado.metodo_pago = this.value; toast('Método de pago actualizado'); pintarTotalBsTicket(); refrescarListadoDeFondo();
  });
  const btnPagado = document.getElementById('btnMarcarPagadoTicket');
  if(btnPagado) btnPagado.addEventListener('click', async function(){
    const {error} = await sb.from('lavados').update({estado:'pagado'}).eq('id', lavado.id);
    if(error){ toast('No se pudo actualizar: '+mensajeError(error), true); return; }
    lavado.estado = 'pagado'; toast('Factura cerrada como pagada'); refrescarListadoDeFondo(); abrirTicketLavado(lavado);
  });
  // Financiar: cierra la factura a crédito. Si ya existe una obligación
  // registrada para este lavado (por ejemplo, ya se le hizo un abono), no
  // se duplica el crédito: el saldo pendiente ya está correctamente
  // reflejado en Créditos y débitos.
  const btnFinanciar = document.getElementById('btnFinanciarTicket');
  if(btnFinanciar) btnFinanciar.addEventListener('click', function(){
    if(!lavado.cliente_id){ toast('Este lavado no tiene un cliente registrado para financiarlo', true); return; }
    if(saldoPendiente <= 0){ toast('Esta factura no tiene saldo pendiente por financiar', true); return; }
    confirmarAccion('Financiar / Fiado',
      'Se cerrará la factura de '+lavado.nombre_cliente+' y quedará un saldo de '+fmtUsd(saldoPendiente)+' registrado como deuda en su cuenta, visible en Créditos y débitos.',
      'Financiar', async ()=>{
        await asegurarObligacionLavado(lavado.id, lavado.cliente_id, total);
        const {error} = await sb.from('lavados').update({estado:'pagado', metodo_pago:'credito'}).eq('id', lavado.id);
        if(error){ toast('No se pudo cerrar la factura: '+mensajeError(error), true); return; }
        lavado.estado='pagado'; lavado.metodo_pago='credito';
        toast('Factura financiada y deuda registrada'); cerrarModal();
        refrescarListadoDeFondo(); abrirTicketLavado(lavado);
      });
  });
  document.getElementById('btnActualizarTicket').addEventListener('click', function(){
    cerrarModal(); refrescarListadoDeFondo(); toast('Listado actualizado');
  });
  document.getElementById('btnCobroAbono').addEventListener('click', function(){
    modalMovimientoCliente(
      {id: lavado.cliente_id, nombre: lavado.nombre_cliente, telefono: lavado.telefono},
      null,
      {referencia_lavado_id: lavado.id, total, saldoPendiente, volverAlTicket: lavado}
    );
  });
  document.getElementById('btnImprimirRecibo').addEventListener('click', ()=> imprimirReciboLavado(lavado));
}

// Refresca la vista que está detrás del modal para ver los montos al instante
function refrescarListadoDeFondo(){
  if(VISTA_ACTUAL === 'lavados') buscarLavados();
  else if(VISTA_ACTUAL === 'resumen') cargarResumen();
}

/* =====================================================================
   TIEMPO REAL — los listados se actualizan solos en todos los equipos
===================================================================== */
let CANAL_TIEMPO_REAL = null;
let temporizadorRefresco = null;
function refrescarVistaActual(){
  // Se agrupan los avisos para no recargar muchas veces seguidas
  clearTimeout(temporizadorRefresco);
  temporizadorRefresco = setTimeout(function(){
    if(document.getElementById('modalOverlay')) return; // no interrumpir un formulario abierto
    const recarga = {
      resumen: cargarResumen, lavados: buscarLavados, citas: buscarCitas,
      cuentas_clientes: (CUENTAS_TAB==='saldos'?buscarCuentasClientes:buscarClientesRegistrados),
      fidelidad: cargarFidelidad, lluvia: buscarLluvia
    }[VISTA_ACTUAL];
    if(recarga){ try{ recarga(); }catch(e){} }
    else if(VISTA_ACTUAL==='productos'){
      const r = {catalogo:buscarProductosCatalogo, ventas:renderVentasHistorial}[PROD_TAB];
      if(r){ try{ r(); }catch(e){} }
    }
  }, 400);
}
function activarTiempoReal(){
  if(CANAL_TIEMPO_REAL) return;
  try{
    CANAL_TIEMPO_REAL = sb.channel('cambios-panel')
      .on('postgres_changes', {event:'*', schema:'public', table:'lavados'}, refrescarVistaActual)
      .on('postgres_changes', {event:'*', schema:'public', table:'lavado_extras'}, refrescarVistaActual)
      .on('postgres_changes', {event:'*', schema:'public', table:'ventas_productos'}, refrescarVistaActual)
      .on('postgres_changes', {event:'*', schema:'public', table:'movimientos_cuenta_cliente'}, refrescarVistaActual)
      .on('postgres_changes', {event:'*', schema:'public', table:'citas'}, refrescarVistaActual)
      .on('postgres_changes', {event:'*', schema:'public', table:'productos'}, refrescarVistaActual)
      .subscribe();
  }catch(e){ console.error('No se pudo activar el tiempo real', e); }
}

/* =====================================================================
   CÓDIGO DE AUTORIZACIÓN — permite al vendedor reversar con permiso
   del jefe. Jefe y admin no necesitan escribirlo.
===================================================================== */
function pedirCodigoAutorizacion(titulo, mensaje, onOk){
  if(esJefeOAdmin()){ onOk(null); return; }
  abrirModal(titulo, `
    <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 4px;">${esc(mensaje)}</p>
    <label class="field-label">Código de autorización</label>
    <input type="password" id="acCodigo" placeholder="Solicítalo al jefe" autocomplete="off">
    <label class="field-label">Motivo</label>
    <textarea id="acMotivo" placeholder="Explica brevemente el motivo…"></textarea>
    <div class="modal-actions">
      <button class="btn btn-glass btn-block" id="acCancelar">Cancelar</button>
      <button class="btn btn-danger btn-block" id="acConfirmar">Confirmar</button>
    </div>
  `);
  document.getElementById('acCancelar').addEventListener('click', cerrarModal);
  document.getElementById('acConfirmar').addEventListener('click', async function(){
    const codigo = document.getElementById('acCodigo').value.trim();
    const motivo = document.getElementById('acMotivo').value.trim();
    if(!codigo){ toast('Escribe el código de autorización', true); return; }
    if(!motivo){ toast('Escribe el motivo', true); return; }
    const btn=this; btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Verificando…';
    const {data: valido, error} = await sb.rpc('validar_codigo_autorizacion', {p_codigo: codigo});
    if(error || !valido){
      toast(error?('No se pudo verificar: '+mensajeError(error)):'Código de autorización incorrecto', true);
      btn.disabled=false; btn.innerHTML='Confirmar'; return;
    }
    onOk(codigo, motivo);
  });
}

async function cargarCitas(){
  var c = document.getElementById('content');
  c.innerHTML = `
    <div class="section-head"><h2>Citas de lavado</h2><button class="btn btn-primary btn-sm" id="btnNuevaCita"><i data-ic="plus"></i>Apartar cita</button></div>
    <div class="filters-row">
      <select id="fCitaEstado"><option value="">Todos los estados</option><option value="pendiente">Pendientes</option><option value="confirmada">Confirmadas</option><option value="completada">Completadas</option><option value="cancelada">Canceladas</option></select>
      <input type="date" id="fCitaFecha" value="${hoy()}">
      <button class="btn btn-glass btn-sm" id="fCitaVerTodas">Ver todas</button>
    </div>
    <div class="card-list" id="listaCitas"></div>`;
  drawIcons(c);
  document.getElementById('btnNuevaCita').addEventListener('click', ()=> modalNuevaCita());
  document.getElementById('fCitaVerTodas').addEventListener('click', ()=>{ document.getElementById('fCitaFecha').value=''; buscarCitas(); });
  document.getElementById('fCitaEstado').addEventListener('change', buscarCitas);
  document.getElementById('fCitaFecha').addEventListener('change', buscarCitas);
  buscarCitas();
}
async function buscarCitas(){
  const cont = document.getElementById('listaCitas');
  cont.innerHTML = '<div class="empty-state">Cargando…</div>';
  let q = sb.from('citas').select('*').order('fecha',{ascending:true}).order('hora',{ascending:true}).limit(150);
  const est = document.getElementById('fCitaEstado').value;
  const fecha = document.getElementById('fCitaFecha').value;
  if(est) q = q.eq('estado', est);
  if(fecha) q = q.eq('fecha', fecha);
  const {data, error} = await q;
  if(error){ cont.innerHTML = `<div class="error-state">No se pudo cargar: ${esc(mensajeError(error))}</div>`; return; }
  if(!data || data.length===0){ cont.innerHTML = emptyState('calendar','No hay citas con estos filtros'); return; }
  const ahora = new Date();
  cont.innerHTML = data.map(c=>{
    const venc = new Date(c.fecha+'T'+c.hora);
    const estadoMostrado = (['pendiente','confirmada'].includes(c.estado) && venc < ahora) ? 'vencida' : c.estado;
    let acciones = '';
    if(c.estado==='pendiente') acciones += `<button class="btn btn-glass btn-sm" onclick="cambiarEstadoCita('${c.id}','confirmada')">Confirmar</button>`;
    if(['pendiente','confirmada'].includes(c.estado)) acciones += `<button class="btn btn-primary btn-sm" onclick='atenderCita(${JSON.stringify(c)})'>Atender ahora</button>`;
    if(['pendiente','confirmada'].includes(c.estado)) acciones += `<button class="btn btn-danger btn-sm" onclick="cambiarEstadoCita('${c.id}','cancelada')">Cancelar</button>`;
    return `<div class="item-row glass st-${esc(estadoMostrado)}">
      <span class="info">
        <span class="t1">${esc(c.nombre_cliente)} ${badge(estadoMostrado)}</span>
        <span class="t2">${esc(labelTipoVeh(c.tipo_vehiculo))} · ${c.modalidad==='domicilio'?'A domicilio':'En el local'} · ${fmtFecha(c.fecha)} ${esc(c.hora)} · ${esc(c.telefono)}</span>
      </span>
      <span class="acts">${acciones}</span>
    </div>`;
  }).join('');
  drawIcons(cont);
}

  toast('Cita actualizada'); buscarCitas();

  const jefe = esJefeOAdmin();
  const tabs = [
    {id:'catalogo', label:'Catálogo'}, {id:'vender', label:'Vender'}, {id:'ventas', label:'Ventas'},

  if(render) render();

const CAT_LABEL = {consumible:'Consumible', repuesto:'Repuesto', accesorio:'Accesorio'};

async function renderCatalogoProductos(){

  var body = document.getElementById('prodBody');
  body.innerHTML = `
    <div class="section-head"><h2>Catálogo de productos</h2>${jefe?'<button class="btn btn-primary btn-sm" id="btnNuevoProducto"><i data-ic="plus"></i>Nuevo producto</button>':''}</div>
    <div class="filters-row">

      <input type="text" id="fProdBuscar" placeholder="Buscar por nombre o SKU…">

  document.getElementById('fProdBuscar').addEventListener('input', debounce(buscarProductosCatalogo, 260));

function debounce(fn, ms){ let t; return function(){ clearTimeout(t); const a=arguments; t=setTimeout(()=>fn.apply(null,a), ms); }; }
async function buscarProductosCatalogo(){
  const jefe = esJefeOAdmin();
  const cont = document.getElementById('listaProductos');
  cont.innerHTML = '<div class="empty-state">Cargando…</div>';
  let q = sb.from('productos').select('*').order('nombre');
  const cat = document.getElementById('fProdCat').value;
  const texto = document.getElementById('fProdBuscar').value.trim();
  if(cat) q = q.eq('categoria', cat);
  if(texto) q = q.or(`nombre.ilike.%${texto}%,sku.ilike.%${texto}%`);
  const {data, error} = await q;
  if(error){ cont.innerHTML = `<div class="error-state">No se pudo cargar: ${esc(mensajeError(error))}</div>`; return; }
  if(!data || data.length===0){ cont.innerHTML = emptyState('box','No hay productos con estos filtros'); return; }
  cont.innerHTML = data.map(p=>{
    const bajo = Number(p.stock) <= Number(p.stock_minimo);
    return `<div class="item-row glass ${bajo?'st-vencida':'st-completada'}">
      <span class="info">
        <span class="t1">${esc(p.nombre)} <span class="chip">${CAT_LABEL[p.categoria]||p.categoria}</span>${!p.activo?'<span class="badge b-cancelada">Inactivo</span>':''}</span>
        <span class="t2">Stock: ${esc(p.stock)} ${esc(p.unidad)} ${bajo?'· <span style="color:var(--amber);font-weight:700;">bajo mínimo</span>':''}${p.sku?(' · SKU '+esc(p.sku)):''}${jefe?(' · Costo '+fmtUsd(p.costo_usd)):''}</span>
      </span>
      <span class="amt mono">${fmtUsd(p.precio_usd)}</span>
      ${jefe?`<span class="acts">
        <button class="btn btn-glass btn-sm" onclick='abrirModalProductoJSON(${JSON.stringify(p)})'><i data-ic="pencil"></i></button>
        <button class="btn btn-danger btn-sm" onclick='pedirEliminarProducto(${JSON.stringify({id:p.id, nombre:p.nombre})})'><i data-ic="trash-2"></i></button>
      </span>`:''}
    </div>`;
  }).join('');
  drawIcons(cont);
}
function abrirModalProductoJSON(p){ modalProducto(p); }
function pedirEliminarProducto(p){
  confirmarAccion('Eliminar producto', `¿Eliminar "${p.nombre}" del catálogo? Esta acción no se puede deshacer.`, 'Eliminar', async ()=>{
    const {error} = await sb.from('productos').delete().eq('id', p.id);

  });
  document.getElementById('btnAgregarCarrito').addEventListener('click', function(){
    const sel = document.getElementById('vpProducto');

    if(!opt || !opt.value){ toast('Selecciona un producto', true); return; }
    const existente = CARRITO.find(x=>x.producto_id===opt.value);
    const stockDisp = Number(opt.dataset.stock);
    if(existente){ if(existente.cantidad+1 > stockDisp){ toast('No hay suficiente stock', true); return; } existente.cantidad += 1; }
    else{ if(stockDisp<1){ toast('Sin stock disponible', true); return; } CARRITO.push({producto_id:opt.value, nombre:opt.dataset.nombre, precio:Number(opt.dataset.precio), stockDisp, cantidad:1}); }
    pintarCarrito();
  });

function pintarCarrito(){
  const cont = document.getElementById('carritoLineas');
  if(CARRITO.length===0){ cont.innerHTML = emptyState('shopping-cart','El carrito está vacío'); document.getElementById('carritoTotal').textContent='$0.00'; drawIcons(cont); return; }
  cont.innerHTML = CARRITO.map((it,i)=>`
    <div class="cart-line">
      <span class="cl-name">${esc(it.nombre)}</span>
      <span class="qty-stepper">
        <button type="button" onclick="cambiarCantCarrito(${i},-1)"><i data-ic="x"></i></button>
        <span class="mono" style="min-width:20px;text-align:center;">${it.cantidad}</span>
        <button type="button" onclick="cambiarCantCarrito(${i},1)"><i data-ic="plus"></i></button>
      </span>
      <span class="cl-amt mono">${fmtUsd(it.precio*it.cantidad)}</span>
    </div>`).join('');
  drawIcons(cont);
  const total = CARRITO.reduce((a,b)=>a+b.precio*b.cantidad,0);
  document.getElementById('carritoTotal').textContent = fmtUsd(total);
  const metodoSel = document.getElementById('vpMetodo');
  const bsCont = document.getElementById('vpTotalBs');
  if(metodoSel && bsCont){
    bsCont.textContent = lineaTotalBs(total, metodoSel.value);
  }
}
function cambiarCantCarrito(i, delta){
  const it = CARRITO[i]; if(!it) return;
  const nueva = it.cantidad + delta;
  if(nueva <= 0){ CARRITO.splice(i,1); pintarCarrito(); return; }
  if(nueva > it.stockDisp){ toast('No hay suficiente stock', true); return; }
  it.cantidad = nueva; pintarCarrito();
}
async function registrarVenta(){
  if(CARRITO.length===0){ toast('Agrega al menos un producto', true); return; }
  const btn = document.getElementById('btnRegistrarVenta');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Guardando…';
  const telefono = document.getElementById('vpTelefono').value.trim();
  const nombre = document.getElementById('vpNombre').value.trim();
  let cliente = null;
  if(telefono){
    const {data, error} = await buscarOCrearCliente(telefono, nombre);
    if(error){ toast('No se pudo registrar el cliente: '+mensajeError(error), true); btn.disabled=false; btn.innerHTML='Registrar venta'; return; }
    cliente = data;
  }
  const metodo = document.getElementById('vpMetodo').value;
  if(metodo==='credito' && !cliente){ toast('Para vender a crédito, indica el teléfono del cliente', true); btn.disabled=false; btn.innerHTML='Registrar venta'; return; }
  const total = CARRITO.reduce((a,b)=>a+b.precio*b.cantidad,0);
  const {data: venta, error: errVenta} = await sb.from('ventas_productos').insert({
    cliente_id: cliente?cliente.id:null, nombre_cliente: nombre?capitalizar(nombre):null,
    metodo_pago: metodo, total_usd: total, vendedor_id: PERFIL.id
  }).select().single();
  if(errVenta){ toast('No se pudo registrar la venta: '+mensajeError(errVenta), true); btn.disabled=false; btn.innerHTML='Registrar venta'; return; }
  for(const it of CARRITO){
    const {error: errItem} = await sb.from('venta_items').insert({venta_id:venta.id, producto_id:it.producto_id, cantidad:it.cantidad, precio_unitario_usd:it.precio, subtotal_usd:it.precio*it.cantidad});
    if(errItem){ toast('Venta creada, pero un producto no se pudo registrar: '+mensajeError(errItem), true); }
  }
  if(metodo==='credito' && cliente){ await registrarMovimientoCuenta(cliente.id, 'credito', total, 'Venta de productos a crédito', {referencia_venta_id: venta.id}); }
  toast('Venta registrada'); CARRITO=[]; renderVenderProductos();
}

async function buscarCuentasClientes(){
  const cont = document.getElementById('listaCuentasClientes');

  const texto = document.getElementById('fClienteBuscar').value.trim();
  let qc = sb.from('clientes').select('*').order('nombre');

  const conSaldo = (clientes||[]).filter(cl => texto || Math.abs(saldos[cl.id]||0) > 0.001).map(cl=> Object.assign({}, cl, {saldo: saldos[cl.id]||0}))

function pedirAnularMovCliente(id, clienteId){
  confirmarAccion('Anular movimiento', 'Esta acción anulará el movimiento de la cuenta del cliente. Escribe el motivo.', 'Anular', async (motivo)=>{
    const {error} = await sb.rpc('anular_movimiento_cuenta', {p_id:id, p_motivo:motivo});
    if(error){ toast('No se pudo anular: '+mensajeError(error), true); return; }
